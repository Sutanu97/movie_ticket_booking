spring.application.name=MovieTicketBookingSystem
spring.datasource.url=jdbc:mysql://localhost:3307/movie_ticket_booking
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.file.name=movie_ticket_booking_system.log
logging.level.com.projects=debug
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#mail.config.filepath = "${MAIL_CONFIG_FILE_PATH}"
mail.config.filepath = /Users/sutanubhattacharya/Documents/mailConfigs.properties
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret.key=${JWT_SECRET_KEY}
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

spring.data.redis.host=localhost
spring.data.redis.port=6380

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=refund-consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.projects.MovieTicketBookingSystem.dto
spring.kafka.consumer.auto-offset-reset=earliest
